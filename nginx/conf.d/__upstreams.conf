# Host nginx upstreams -> docker containers published on 127.0.0.1 loopback.
# Only the live services remain (dead/removed upstreams dropped):
#   server1 (live-api), staging-server1, dev-server1, pgadmin1, v1-api
#   -> all removed.

upstream public-api {
	server 127.0.0.1:3003;
}

upstream pgadmin2 {
	server 127.0.0.1:8081;
}

upstream swagger {
	server 127.0.0.1:8082;
}

upstream live-api {
	server 127.0.0.1:3001;
}

upstream staging-api {
	server 127.0.0.1:3030;
}

upstream archive-v100-api {
	server 127.0.0.1:3004;
}

upstream archive-v0-api {
	server 127.0.0.1:3002;
}
