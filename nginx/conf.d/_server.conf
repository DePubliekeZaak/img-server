# Canonical nginx server blocks (host deployment).
# Hostnames are HARDCODED (stable for years — no env vars, no generation).
#
# Installed by setup.sh ONLY on first run (no-clobber): after that, certbot
# --nginx owns this file and adds the 443/ssl + redirect blocks here. setup.sh
# re-runs NEVER overwrite it, so re-running setup.sh is always safe.
#   Reset: sudo rm -f /etc/nginx/conf.d/_server.conf && sudo nginx/setup.sh
#   (then re-run the certbot command to re-add the TLS blocks).

# main img dashboard + API
server {
	listen 80;
	root /var/www/html;
	index index.html;
	server_name img.publikaan.nl;

	# security headers (pen-test)
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header X-Frame-Options "SAMEORIGIN" always;

	include /etc/nginx/conf.d/img/*locations;
}

# serves the bundle.js and topojson files for the live dashboard
# (domain and paths/redirects matter for cms integration)
server {
	listen 80;
	root /var/www/html;
	server_name graphs.publikaan.nl;

	# security headers (pen-test)
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header X-Frame-Options "SAMEORIGIN" always;

	include /etc/nginx/conf.d/graphs/*.locations;
}

